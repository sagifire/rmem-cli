name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish packages to npm. Leave false for dry-run validation."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Release validation and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project check
        run: npm run check

      - name: Validate npm publish dry-run
        run: |
          npm publish --workspace @rmem/core --dry-run --access public
          npm publish --workspace rmem-cli --dry-run

      - name: Publish @rmem/core
        if: ${{ github.event.inputs.publish == 'true' }}
        run: npm publish --workspace @rmem/core --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish rmem-cli
        if: ${{ github.event.inputs.publish == 'true' }}
        run: npm publish --workspace rmem-cli --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
